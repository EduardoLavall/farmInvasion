name: Playtest
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: farm-game-playtests
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check art.js && node --check game.js && node --check tests/smoke.cjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Start test server
        run: python3 -m http.server 8080 > /tmp/farm-http.log 2>&1 &
      - name: Browser playtest
        timeout-minutes: 4
        run: node tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-playtest-screenshots
          path: artifacts/
          if-no-files-found: ignore
